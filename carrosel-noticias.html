<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts em Alta - Play Zone</title>
  <!-- Link para o CSS -->
  <link href="style.css" rel="stylesheet">
  <!-- Link para o CSS do Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <section id="home" class="carousel-section">
        <div class="container">
          <h2 class="section-title">Destaques</h2>
          <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
              <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
              <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
            </div>
            
            <div class="carousel-inner">
              <div class="carousel-item active" style="background-image: url('img/2014-08-20-tw3-gameplay.webp');">
                <div class="carousel-caption">
                  <span class="badge bg-warning mb-2">🔥 DESTAQUE</span>
                  <h3>Novo RPG promete revolucionar o gênero</h3>
                  <p>Desenvolvedora anuncia título ambicioso com mecânicas inovadoras e gráficos de última geração.</p>
                </div>
              </div>
            </div>
            
            <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
        </div>
      </section>
</body>
</html>
